replicaCount: 2

image:
  repository: ghcr.io/jeetparekh3005/keel/reference-service
  tag: "0.1.3"
  pullPolicy: IfNotPresent

service:
  port: 8000

# Non-secret KEEL_* configuration (rendered into a ConfigMap).
config:
  environment: prod
  oidcIssuer: ""
  oidcAudience: keel-api
  oidcJwksUri: ""
  otlpEndpoint: ""
  otlpInsecure: false
  corsAllowOrigins: "[]" # JSON array string

# KEEL_DATABASE_URL is a secret: reference an existing Secret, never values.
database:
  existingSecret: "" # name of a Secret containing the key below
  secretKey: KEEL_DATABASE_URL

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

networkPolicy:
  enabled: true
  # Egress is default-deny except DNS + these dependency ports. Tighten `to`
  # with real CIDRs/selectors per environment.
  egressPorts: [5432, 4317, 4222, 8080, 443]
