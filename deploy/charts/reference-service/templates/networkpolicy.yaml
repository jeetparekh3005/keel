{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reference-service.fullname" . }}
  labels:
    {{- include "reference-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reference-service.selectorLabels" . | nindent 6 }}
  # Default-deny both directions; only the rules below are allowed.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Inbound only to the HTTP port (from anywhere the CNI permits).
    - ports:
        - port: http
          protocol: TCP
  egress:
    # DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Dependency ports (DB, OTLP, NATS, OIDC, TLS). Restrict `to` per environment.
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
