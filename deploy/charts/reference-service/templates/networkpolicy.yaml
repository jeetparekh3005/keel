{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reference-service.fullname" . }}
  labels:
    {{- include "reference-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reference-service.selectorLabels" . | nindent 6 }}
  # Default-deny both directions; only the rules below are allowed.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Inbound to the HTTP port, from cluster workloads only (e.g. the ingress
    # controller / gateway). Tighten the selector to specific namespaces per env.
    - from:
        - namespaceSelector: {}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS resolution (kube-dns lives in the cluster).
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Dependency ports (DB, OTLP, NATS, OIDC, TLS), cluster-internal only -
    # this blocks egress to the public internet. Add explicit `ipBlock` CIDRs
    # for any out-of-cluster dependency (e.g. an external IdP).
    - to:
        - namespaceSelector: {}
      ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
