apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reference-service.fullname" . }}
  labels:
    {{- include "reference-service.labels" . | nindent 4 }}
data:
  KEEL_ENVIRONMENT: {{ .Values.config.environment | quote }}
  KEEL_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  KEEL_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  KEEL_OIDC_JWKS_URI: {{ .Values.config.oidcJwksUri | quote }}
  KEEL_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  KEEL_OTLP_INSECURE: {{ .Values.config.otlpInsecure | quote }}
  KEEL_CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
