# cargo-audit configuration (consumed by the `cargo audit` gate in rust.yml).
#
# Triaged, accepted-risk advisories. Each entry is a KNOWN advisory with no in-range fix
# whose exposure is test/dev-only; the gate still blocks any NEW advisory. Review on each
# dependency bump (Dependabot cargo ecosystem).
[advisories]
ignore = [
    # rsa 0.9.x "Marvin Attack" timing sidechannel. `rsa` is a DEV-only dependency used
    # solely to generate ephemeral RSA keypairs in the OIDC auth tests; it is not in the
    # shipped binary. No fixed release exists (the advisory's >=0.10.0 is unpublished), and
    # the timing attack does not apply to one-shot test keygen.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys CVE via C SQLite. SQLite is used only by the in-memory test database;
    # production connects to Postgres and never opens a SQLite datasource, so the vulnerable
    # code is never exercised. No in-range fix (needs >=0.39.0 via a future sqlx release).
    "RUSTSEC-2026-0459",
    # chrono "unmaintained" (informational, not a vulnerability). Pulled DEV-only via
    # aws-smithy-mocks -> aws-smithy-http-client[test-util] -> aws-smithy-protocol-test ->
    # cbor-diag -> chrono (the AWS SDK mocking stack for the ADR-0024 `aws` unit tests); it is
    # not in the shipped binary (the production `aws-smithy-http-client` uses only rustls-ring).
    # No action available until the AWS smithy test crates drop chrono.
    "RUSTSEC-2026-0543",
    # crypto-bigint 0.5.5 constant-time timing variability. NOT in the shipped binary: verified
    # with `cargo tree --features nats,grpc,vault,aws,gcp -e no-dev -i crypto-bigint@0.5.5`
    # (reports "not in shipped graph"). It is a locked-but-inactive optional pulled only by
    # jsonwebtoken's RustCrypto ECDSA path (p256/p384 -> ecdsa -> elliptic-curve 0.13 ->
    # crypto-bigint 0.5), which the `gcp` feature's `jwt-rust-crypto` makes resolvable but never
    # activates: the GCP adapter authenticates via ADC (metadata-server tokens, or RSA
    # service-account keys signed with RS256 -> rsa -> crypto-bigint 0.7.11, the patched line),
    # never local ECDSA signing. jwt-rust-crypto is required so jsonwebtoken uses pure-Rust crypto
    # instead of aws-lc-rs (ADR-0024 ring-only posture), so the inactive 0.5 branch cannot be
    # dropped without reintroducing aws-lc. No in-range fix (needs jsonwebtoken to bump
    # elliptic-curve to a crypto-bigint >=0.7 release).
    "RUSTSEC-2026-0387",
]
