# Copier template for a keel Python service (ADR-0021, ADR-0009 Tier 2).
# `keel new service` (copier copy) renders this into a new thin FastAPI service that depends on
# keel-core-py by version; `keel update` (copier update) propagates template changes. The
# template is the reference service with its service-specific identifiers parameterized; CI
# regenerates the reference service from it to keep the two in lockstep (the dogfood test).

_subdirectory: template
_answers_file: .copier-answers.yml
# Render every file (the sources have no literal << >> and the custom delimiters below avoid
# any collision with Python braces), rather than only *.jinja files.
_templates_suffix: ""

# Custom Jinja delimiters so Python's own braces (f-strings like f"{item_id}") never collide
# with templating. Variables are << >>, blocks <% %>, comments <# #>.
_envops:
  variable_start_string: "<<"
  variable_end_string: ">>"
  block_start_string: "<%"
  block_end_string: "%>"
  comment_start_string: "<#"
  comment_end_string: "#>"

service_name:
  type: str
  help: "Human-readable service name"
  default: "Orders Service"

service_slug:
  type: str
  help: "Service slug (kebab-case): directory, Python package, image, chart"
  default: "<< service_name | lower | replace(' ', '-') >>"

python_package:
  type: str
  help: "Python package name (snake_case)"
  default: "<< service_slug | replace('-', '_') >>"
  when: false

aggregate:
  type: str
  help: "Primary aggregate, singular snake_case (e.g. order)"
  default: "item"

aggregate_pascal:
  type: str
  default: "<< aggregate.split('_') | map('capitalize') | join >>"
  when: false

aggregate_plural:
  type: str
  help: "Plural of the aggregate (routes, table, scope prefix)"
  default: "<< aggregate >>s"

scope_prefix:
  type: str
  help: "OAuth scope prefix (e.g. orders -> orders:read / orders:write)"
  default: "<< aggregate_plural >>"
