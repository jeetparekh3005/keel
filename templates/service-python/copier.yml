# Copier template for a keel Python service (ADR-0021, ADR-0009 Tier 2).
# `keel new service` (copier copy) renders this into a new thin FastAPI service that depends on
# keel-core-py by version; `keel update` (copier update) propagates template changes. The
# template is the reference service with its service-specific identifiers parameterized; CI
# regenerates the reference service from it to keep the two in lockstep (the dogfood test).

_subdirectory: template
_answers_file: .copier-answers.yml
# Render every file (the sources have no literal << >> and the custom delimiters below avoid
# any collision with Python braces), rather than only *.jinja files.
_templates_suffix: ""

# Lint + format the rendered sources with ruff. The template sources are formatted for the
# reference aggregate (item); a longer, multi-word aggregate (e.g. order_line -> OrderLine /
# order_lines / SqlOrderLineRepository) shifts isort's grouping and pushes lines past the
# line-length limit, so the generated service would fail its own `ruff check` / `ruff format
# --check` CI gate. We run `ruff check --fix` first (sorts imports, drops unused) then `ruff
# format` (wraps the now-longer lines); they are chained with `;` not `&&` because `ruff check
# --fix` exits non-zero when it leaves residual E501 lines that only `ruff format` can wrap, and
# format must still run. uvx fetches ruff on demand, so we gate on uvx (no ruff-on-PATH
# assumption). When uvx is absent we do NOT fail generation (the byte-identical dogfood runs
# without it, and the committed reference is already ruff-clean) but WARN loudly so a user who
# generated a non-item service knows the output is unformatted. An explicit if/else keeps the
# "uvx missing" warning distinct from a ruff that is present but FAILS on unparseable output.
_tasks:
  - "if command -v uvx >/dev/null 2>&1; then uvx ruff check --fix --quiet . ; uvx ruff format --quiet . || echo 'keel: ruff format failed on the generated Python sources (see the error above); fix them or the ruff CI gate will fail.' >&2; else echo 'keel: uvx not found on PATH - generated Python sources were NOT lint-fixed/formatted; run `ruff check --fix . && ruff format .` before committing or the ruff CI gate will fail.' >&2; fi"

# Custom Jinja delimiters so Python's own braces (f-strings like f"{item_id}") never collide
# with templating. Variables are << >>, blocks <% %>, comments <# #>.
_envops:
  variable_start_string: "<<"
  variable_end_string: ">>"
  block_start_string: "<%"
  block_end_string: "%>"
  comment_start_string: "<#"
  comment_end_string: "#>"

service_name:
  type: str
  help: "Human-readable service name"
  default: "Orders Service"

service_slug:
  type: str
  help: "Service slug (kebab-case): directory, Python package, image, chart"
  default: "<< service_name | lower | replace(' ', '-') >>"

python_package:
  type: str
  help: "Python package name (snake_case)"
  default: "<< service_slug | replace('-', '_') >>"
  when: false

aggregate:
  type: str
  help: "Primary aggregate, singular snake_case (e.g. order)"
  default: "item"

aggregate_pascal:
  type: str
  default: "<< aggregate.split('_') | map('capitalize') | join >>"
  when: false

aggregate_plural:
  type: str
  help: "Plural of the aggregate (routes, table, scope prefix)"
  default: "<< aggregate >>s"

scope_prefix:
  type: str
  help: "OAuth scope prefix (e.g. orders -> orders:read / orders:write)"
  default: "<< aggregate_plural >>"

# ADR-0028 (standalone, extractable services). Off (default) renders the monorepo-form: the
# reference service and the ADR-0021 byte-identical dogfood - keel-core by the uv workspace source
# and the ruff config inherited from the repo-root pyproject.toml. On renders the standalone-form:
# a self-contained project that builds + tests OUTSIDE the uv workspace - keel-core by published
# PyPI version and a self-contained [tool.ruff] (no workspace source to resolve, no root config to
# inherit), so `cp -r` of the generated directory is a buildable, testable repo on its own
# (extraction is a copy, not a transform). WAVE 1 covers only the keel-core dependency + the ruff
# config inheritance; charts are WAVE 2. Default MUST stay false so the in-repo reference stays
# byte-identical.
standalone:
  type: bool
  help: "Standalone-form (ADR-0028): self-contained project that builds outside the monorepo"
  default: false

# The PyPI version of keel-core the standalone-form depends on (only consulted when standalone is
# true). Until keel-core is published, the extracted-repo CI smoke resolves this to a locally-built
# wheel installed into the venv (ADR-0028 "locally-built CI stand-in").
keel_core_version:
  type: str
  help: "keel-core PyPI version for the standalone-form dependency"
  default: "0.8.0"
  when: "<< standalone >>"
