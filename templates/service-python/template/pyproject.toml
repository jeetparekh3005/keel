[project]
name = "keel-<< service_slug >>"
version = "0.1.0"
description = "<< service_name >>: a thin FastAPI service built on keel-core (proves the contract)"
requires-python = ">=3.12"
dependencies = [
    << '"keel-core==' + keel_core_version + '",' if standalone else '"keel-core",' >>
    "fastapi>=0.162.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "asyncpg>=0.29",  # Postgres driver loaded by SQLAlchemy via URL (not imported)
]

[tool.deptry.per_rule_ignores]
# asyncpg is selected by the database URL at runtime, never imported in source.
DEP002 = ["asyncpg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/<< python_package >>"]

<% if standalone -%>
# Standalone-form (ADR-0028): outside the uv workspace there is no repo-root pyproject.toml to
# inherit from, so this mirrors the repo-root [tool.ruff] (adapted for a single service) and must
# keep the generated sources passing `ruff check` / `ruff format --check` exactly as they do in
# the monorepo. The monorepo-form render replaces this whole block with the workspace source.
[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are not held to the strict lint pack (same as the repo root).
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle + pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "D",                # pydocstyle (public-surface docstrings)
    "UP",               # pyupgrade
    "ANN",              # annotations
    "ASYNC",            # async pitfalls
    "S",                # bandit (SAST)
    "B",                # bugbear
    "C4",               # comprehensions
    "DTZ",              # tz-aware datetimes
    "T20",              # ban print()
    "LOG", "G",         # logging hygiene
    "PT",               # pytest style
    "RSE", "RET",       # raise / return
    "SIM",              # simplify
    "TID",              # banned / relative imports
    "PTH",              # use pathlib
    "FBT",              # boolean trap
    "SLF",              # private member access
    "TRY",              # exception anti-patterns
    "EM",               # error messages
    "PERF",             # perflint
    "FURB",             # refurb
    "ERA",              # eradicate (commented-out code)
    "RUF",              # ruff-specific
]
ignore = [
    "TRY003",           # EM rules cover long messages; allow inline where sensible
]

[tool.ruff.lint.isort]
known-first-party = ["keel_core", "<< python_package >>"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "D", "ANN", "EM", "TRY"]
<%- else -%>
[tool.uv.sources]
keel-core = { workspace = true }
<%- endif %>
