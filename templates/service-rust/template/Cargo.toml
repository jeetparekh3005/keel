[package]
name = "@< service_slug >@"
description = "keel reference service (Rust vertical): a thin service over keel-core-rust."
@< 'version = "0.1.0"' if standalone else "version.workspace = true" >@
@< 'edition = "2021"' if standalone else "edition.workspace = true" >@
@< 'license = "Apache-2.0"' if standalone else "license.workspace = true" >@
@< 'rust-version = "1.82"' if standalone else "rust-version.workspace = true" >@

[lib]
name = "@< service_slug_snake >@"
path = "src/lib.rs"

[[bin]]
name = "@< service_name >@"
path = "src/main.rs"

[dependencies]
@< 'keel-core-rs = "' ~ keel_core_version ~ '"' if standalone else 'keel-core-rs = { path = "../../packages/keel-core-rust" }' >@
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "any",
    "postgres",
] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
