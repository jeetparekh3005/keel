# Copier template for a keel Rust service (ADR-0021, ADR-0009 Tier 2).
# `keel new service --language rust` (copier copy) renders this into a thin axum service that
# depends on keel-core-rust; `keel update` (copier update) propagates template changes. The
# template is the reference service with its service-specific identifiers parameterized; CI
# regenerates the reference service from it and asserts byte-identical output (the dogfood test).

_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: ""

# Delimiters @< >@ / @% %@ / @# #@. Rust angle generics (Vec<Item>) put a `<` immediately before
# the aggregate, so << >> mis-lexes as <<<; Cargo.toml uses [[bin]], so [[ ]] collides too. The `@`
# prefix never abuts Rust type syntax or TOML table headers, so these are collision-free.
_envops:
  variable_start_string: "@<"
  variable_end_string: ">@"
  block_start_string: "@%"
  block_end_string: "%@"
  comment_start_string: "@#"
  comment_end_string: "#@"

service_slug:
  type: str
  help: "Service slug (kebab-case): directory, Cargo package name, image"
  default: "orders-service"

service_slug_snake:
  type: str
  default: "@< service_slug.replace('-', '_') >@"
  when: false

service_name:
  type: str
  help: "Binary / service name (kebab-case): the compiled bin and the service_name default"
  default: "@< service_slug >@"

aggregate:
  type: str
  help: "Primary aggregate, singular (e.g. order)"
  default: "item"

aggregate_pascal:
  type: str
  default: "@< aggregate.split('_') | map('capitalize') | join >@"
  when: false

aggregate_plural:
  type: str
  help: "Plural of the aggregate (routes, table, scope prefix)"
  default: "@< aggregate >@s"

aggregate_pascal_plural:
  type: str
  default: "@< aggregate_plural.split('_') | map('capitalize') | join >@"
  when: false

scope_prefix:
  type: str
  help: "OAuth scope prefix (e.g. orders -> orders:read / orders:write)"
  default: "@< aggregate_plural >@"
