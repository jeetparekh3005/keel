[project]
name = "keel"
version = "0.0.0"
description = "keel monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# The Rust, Go, TypeScript, and Java verticals live under packages/ and services/ too; they
# are not uv members.
exclude = [
    "packages/keel-core-rust",
    "services/reference-service-rust",
    "packages/keel-core-go",
    "services/reference-service-go",
    "packages/keel-core-ts",
    "services/reference-service-nest",
    "packages/keel-core-java",
    "services/reference-service-java",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "import-linter>=2.16",
    "codespell>=2.3",
    "deptry>=0.20",
    "httpx>=0.27",            # Starlette TestClient transport (tests only)
    "aiosqlite>=0.20",        # async SQLite driver for fast repository tests
    "jsonschema>=4.23",       # validate platform.yaml against its schema
    "pyyaml>=6.0",            # load platform.yaml in tests + the keel CLI
    "types-PyYAML>=6.0",      # yaml stubs for mypy (keel_cli loads platform.yaml in src)
    "alembic>=1.13",          # migration tool (run by the service image at deploy)
    "grpcio>=1.60",           # keel-core[grpc] extra - installed for the gRPC tests
    "opentelemetry-instrumentation-grpc>=0.48b0",
    "psycopg[binary]>=3.3.8",   # sync Postgres driver for Alembic migrations in CI
    "nats-py>=2.6",           # keel-core[nats] extra - installed for the NATS integration test
]

# ---------------------------------------------------------------------------
# Lint / format - Ruff. See docs/adr/0010-enforcement-strategy.md for the
# rationale behind each pack.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/keel-core-py/src", "packages/keel-cli/src", "services/reference-service/src"]
# templates/ holds Copier templates (<< >> placeholders), not runnable source; the generator
# lane (generator.yml) renders + lints a generated service instead.
extend-exclude = ["**/migrations/**", "templates/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle + pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "D",                # pydocstyle (public-surface docstrings)
    "UP",               # pyupgrade
    "ANN",              # annotations
    "ASYNC",            # async pitfalls
    "S",                # bandit (SAST)
    "B",                # bugbear
    "C4",               # comprehensions
    "DTZ",              # tz-aware datetimes
    "T20",              # ban print()
    "LOG", "G",         # logging hygiene
    "PT",               # pytest style
    "RSE", "RET",       # raise / return
    "SIM",              # simplify
    "TID",              # banned / relative imports
    "PTH",              # use pathlib
    "FBT",              # boolean trap
    "SLF",              # private member access
    "TRY",              # exception anti-patterns
    "EM",               # error messages
    "PERF",             # perflint
    "FURB",             # refurb
    "ERA",              # eradicate (commented-out code)
    "RUF",              # ruff-specific
]
ignore = [
    "TRY003",           # EM rules cover long messages; allow inline where sensible
]

[tool.ruff.lint.isort]
known-first-party = ["keel_core", "keel_cli", "reference_service"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "D", "ANN", "EM", "TRY"]
# CI helper scripts (not library code): print is their output, and they are
# standalone files, not package modules.
"deploy/charts/**/ci/*.py" = ["T201", "INP001", "D103"]
# testkit is test-support code shipped for services; asserts are its whole point.
"**/testkit/**" = ["S101"]
# Domain error taxonomies use intentional names (NotFound, Forbidden, …) over an
# Error suffix; this reads better and the base class already ends in "Error".
"**/errors.py" = ["N818"]

# ---------------------------------------------------------------------------
# Types - mypy strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["grpc.*", "opentelemetry.instrumentation.*", "opentelemetry.exporter.*", "nats.*", "copier.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services"]
addopts = "-q"
markers = [
    "integration: requires external services (Postgres, ...); run in the integration CI job",
]

[tool.coverage.run]
branch = true
# Trace code that runs inside SQLAlchemy's async greenlets (and threadpools),
# otherwise DB-path lines show as false "missing" and the report is untrustworthy.
concurrency = ["greenlet", "thread"]
# `python -m <pkg>` entrypoints are trivial `if __name__` shims exercised by the console script.
omit = ["**/__main__.py"]
# main.py wiring is tested (see test_main.py); only serve()/entrypoint + the
# live-OTLP branch carry `# pragma: no cover`.

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.$"]

[tool.codespell]
skip = "*.lock,./.git,./.venv"
ignore-words-list = "dependant,afterall"  # FastAPI route.dependant + vitest afterAll, not typos

# First-party workspace modules (extend as packages/services are added).
[tool.deptry]
known_first_party = ["keel_core", "keel_cli", "reference_service"]
