// keel reference aggregate, gRPC contract (ADR-0022).
//
// One protobuf package is the single source of truth for the ItemService that
// every vertical serves; stubs are generated into each keel-core-<lang> by buf
// and committed (ADR-0022 option B1), so extracted repos need no buf toolchain.
//
// Per-method required scopes are deliberately NOT encoded as proto options. They
// live in each language's gRPC server factory as a method -> scope map (matching
// the Python keel_core factory's required_scopes argument), so the deny-by-default
// auth interceptor enforces them uniformly. The intended scopes are:
//
//   ItemService.GetItem    -> items:read
//   ItemService.ListItems  -> items:read
//   ItemService.CreateItem -> items:write
//
// A method with no mapped scope stays closed (deny-by-default): the interceptor
// still requires a valid Bearer token before the call reaches the servicer.

syntax = "proto3";

package keel.reference.v1;

// An item in the reference aggregate: the same domain the REST API serves.
message Item {
  // Opaque unique identifier.
  string id = 1;
  // Human-readable name.
  string name = 2;
}

// Request for ItemService.GetItem.
message GetItemRequest {
  // Identifier of the item to fetch.
  string id = 1;
}

// Response for ItemService.GetItem.
message GetItemResponse {
  // The requested item.
  Item item = 1;
}

// Request for ItemService.ListItems.
message ListItemsRequest {
  // Maximum number of items to return.
  int32 limit = 1;
  // Number of items to skip from the start of the collection.
  int32 offset = 2;
}

// Response for ItemService.ListItems.
message ListItemsResponse {
  // The page of items.
  repeated Item items = 1;
}

// Request for ItemService.CreateItem.
message CreateItemRequest {
  // Name of the item to create.
  string name = 1;
}

// Response for ItemService.CreateItem.
message CreateItemResponse {
  // The newly created item.
  Item item = 1;
}

// Read and write slice of the reference aggregate (ADR-0022 option A1).
//
// Required scopes are enforced by each vertical's server factory, not by proto
// options: GetItem/ListItems require items:read, CreateItem requires items:write.
service ItemService {
  // Fetch a single item by id. Requires scope items:read.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // List a page of items. Requires scope items:read.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // Create a new item. Requires scope items:write.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
}
