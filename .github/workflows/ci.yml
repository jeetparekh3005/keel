name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          scopes: |
            python
            ts
            rust
            go
            java
            ci
            docs
            platform
            auth
            db
            security
          requireScope: false

  governance:
    name: Governance files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert required files exist
        run: |
          set -euo pipefail
          required=(
            LICENSE
            README.md
            CONTRIBUTING.md
            SECURITY.md
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            docs/adr/0001-record-architecture-decisions.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required governance file is missing"
              missing=1
            fi
          done
          exit $missing
