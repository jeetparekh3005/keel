name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: No emoji / em-dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for emoji, em/en-dashes, and unicode arrows
        run: |
          # The repo is ASCII-punctuation only (golden rule: no emoji, no em-dashes).
          if git grep -nP '[\x{2013}\x{2014}\x{2015}\x{2190}\x{2192}\x{2600}-\x{27BF}\x{FE0F}\x{1F000}-\x{1FAFF}]' \
               -- ':!uv.lock' ':!pnpm-lock.yaml'; then
            echo "::error::Found emoji / em-dash / en-dash / unicode arrow above. Use ASCII (-, ->)."
            exit 1
          fi
          echo "clean: no emoji or em-dashes"

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          scopes: |
            python
            ts
            rust
            go
            java
            ci
            docs
            platform
            auth
            db
            security
            deps
            deps-dev
          requireScope: false

  governance:
    name: Governance files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert required files exist
        run: |
          set -euo pipefail
          required=(
            LICENSE
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            docs/adr/0001-record-architecture-decisions.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required governance file is missing"
              missing=1
            fi
          done
          exit $missing
