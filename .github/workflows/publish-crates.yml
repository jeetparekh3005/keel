name: publish-crates

# Publishes keel-core-rs to crates.io at its own independent version (ADR-0028, #422).
# Called from release-please.yml when a release is cut; also runnable on demand. Idempotent:
# a version already on crates.io is skipped rather than failing a re-run.

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          # Pinned by SHA, so the action can't infer the toolchain from the ref name
          # (an @stable branch ref would); name it explicitly or the action fails with
          # "'toolchain' is a required input". Matches rust.yml / generator.yml.
          toolchain: stable
      - name: Publish keel-core-rs to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            exit 0
          fi
          ver="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="keel-core-rs"))')"
          # Idempotency: skip if this exact version is already on crates.io (re-run safe).
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/keel-core-rs/${ver}")"
          if [ "$code" = "200" ]; then
            echo "keel-core-rs ${ver} already published; skipping (idempotent)."
            exit 0
          fi
          cargo publish -p keel-core-rs
          echo "published keel-core-rs ${ver} to crates.io"
