name: Frontend

# Lint, type-check, and build the Next.js app on any frontend change.

on:
  # No path filter: this is a required status check, so it must report on every PR
  # (a path-filtered required check hangs as "Expected" on unrelated PRs and blocks
  # the merge). Same rationale as python.yml.
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (CVE gate)
        run: pnpm audit --audit-level high
      # Scoped to the web app: the workspace also holds the TypeScript backend vertical
      # (keel-core-ts + reference-service-nest), which has its own lane (nest.yml).
      - run: pnpm --filter @keel/web run lint
      - run: pnpm --filter @keel/web run typecheck
      - run: pnpm --filter @keel/web run test
      - run: pnpm --filter @keel/web run build
