name: Java

# Format-check, test, layering-check, and vuln-scan the Java/Spring Boot vertical. `mvn verify`
# runs Spotless (google-java-format), JUnit + the Spring Boot conformance test, ArchUnit
# (hexagonal layering), and JaCoCo. Trivy is the dependency-CVE gate (the JVM equivalent of
# govulncheck / pip-audit / pnpm-audit), scanning the built fat jar's bundled dependencies.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-java/**"
      - "services/reference-service-java/**"
      - "coverage-aggregate/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/java.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-java/**"
      - "services/reference-service-java/**"
      - "coverage-aggregate/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/java.yml"

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (format, test, archunit, vuln)
    runs-on: ubuntu-latest
    # Postgres for the reference-service conformance/CRUD integration test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Live Keycloak for the keel-core-java JWKS integration test (epic #419). Reuses the shared
      # realm import (client keel-api / secret test-secret / realm keel). Started as a docker run
      # step rather than a `services:` entry because the realm file is only on disk after checkout.
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step (as the Python lane does).
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start Keycloak (import realm)
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Start OpenBao (dev)
        # Dev-mode OpenBao for the OpenBaoSecretProvider KV v2 integration test (ADR-0023); started
        # as a docker run step like NATS/Keycloak so the realm/import timing matches the other lanes.
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Start LocalStack (Secrets Manager)
        # LocalStack Secrets Manager for the AwsSecretsManagerSecretProvider integration test
        # (ADR-0024); started as a docker run step like the others. The SDK routes here via the
        # standard AWS_ENDPOINT_URL_SECRETS_MANAGER env var below.
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=secretsmanager localstack/localstack:4.9.1
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health >/dev/null && break; sleep 1; done
      - name: Verify (spotless, tests, archunit, jacoco)
        env:
          KEEL_NATS_URL: nats://localhost:4222
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
          KEEL_VAULT_ADDR: http://localhost:8200
          KEEL_VAULT_TOKEN: root
          KEEL_VAULT_MOUNT: secret
          KEEL_VAULT_PATH: keel-test
          AWS_ENDPOINT_URL_SECRETS_MANAGER: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          KEEL_AWS_SECRET_ID: keel-test
        run: mvn -B -Pcoverage-aggregate verify
      - name: Dependency CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/reference-service-java/target
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
