name: Python CI

on:
  pull_request:
    # No path filter: these jobs are required status checks, so they must
    # report on every PR (a path-filtered required check hangs as "Expected"
    # on unrelated PRs and blocks the merge).
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".importlinter"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install toolchain + workspace
        run: uv sync --frozen --all-packages
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy -p keel_core -p keel_cli -p reference_service
      - name: Architecture (import-linter)
        run: uv run lint-imports
      - name: Spelling (codespell)
        run: uv run codespell packages
      - name: Dependencies (deptry)
        run: |
          for pkg in packages/*/ services/*/; do
            # Skip non-Python members (e.g. the Rust vertical shares packages/ and services/).
            [ -f "$pkg/pyproject.toml" ] || continue
            uv run --directory "$pkg" deptry src
          done
      - name: Tests (pytest + coverage floor)
        run: uv run pytest --cov=keel_core --cov=keel_cli --cov=reference_service

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install toolchain + workspace
        run: uv sync --frozen --all-packages
      - name: Alembic migrations against Postgres
        env:
          KEEL_MIGRATION_URL: postgresql+psycopg://keel:keel@localhost:5432/reference
        run: uv run --directory services/reference-service alembic -c alembic.ini upgrade head
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start RabbitMQ
        # Pin rabbitmq:4 (latest stable 4.x line); a plain broker image, so run it as a
        # step with a readiness poll on 5672, mirroring the NATS step above.
        run: |
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:4
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start Keycloak (import realm)
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Start OpenBao (dev)
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Start LocalStack (Secrets Manager)
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=secretsmanager localstack/localstack:4.9.1
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health >/dev/null && break; sleep 1; done
      - name: Integration tests (real Postgres + NATS + RabbitMQ + Keycloak + OpenBao + LocalStack)
        env:
          KEEL_TEST_DATABASE_URL: postgresql+asyncpg://keel:keel@localhost:5432/reference
          KEEL_NATS_URL: nats://localhost:4222
          KEEL_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
          KEEL_VAULT_ADDR: http://localhost:8200
          KEEL_VAULT_TOKEN: root
          KEEL_VAULT_MOUNT: secret
          KEEL_VAULT_PATH: keel-test
          AWS_ENDPOINT_URL_SECRETS_MANAGER: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          KEEL_AWS_SECRET_ID: keel-test
        run: uv run pytest -m integration
