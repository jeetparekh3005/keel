name: TypeScript backend

# Format, lint, type-check, test, and vuln-scan the TypeScript/NestJS vertical. pnpm audit
# is the dependency-CVE gate (the Node-native equivalent of pip-audit / cargo-audit /
# govulncheck). The frontend app has its own lane (frontend.yml); this one is scoped to
# keel-core-ts + reference-service-nest.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-ts/**"
      - "services/reference-service-nest/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nest.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-ts/**"
      - "services/reference-service-nest/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nest.yml"

permissions:
  contents: read

concurrency:
  group: nest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nest:
    name: Node (lint, typecheck, test, vuln)
    runs-on: ubuntu-latest
    # Postgres for the reference-service CRUD integration test (gated on the URL below).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (CVE gate)
        run: pnpm audit --audit-level high
      # The service resolves @keel/core from its built dist, so build the library first.
      - name: Build the shared library
        run: pnpm --filter @keel/core run build
      - name: Lint
        run: pnpm --filter @keel/core --filter reference-service-nest run lint
      - name: Type-check
        run: pnpm --filter @keel/core --filter reference-service-nest run typecheck
      - name: Format check
        run: pnpm --filter @keel/core --filter reference-service-nest run format:check
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step. The NATS JetStream
        # MessageBus integration test (@keel/core) is gated on KEEL_NATS_URL below.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start Keycloak (import realm)
        # A service container cannot pass `start-dev --import-realm`, so run it as a step. The
        # live-JWKS auth integration test (@keel/core) is gated on KEEL_KEYCLOAK_URL below.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:25.0 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Test (with Postgres + NATS + Keycloak)
        env:
          KEEL_NATS_URL: nats://localhost:4222
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
        run: pnpm --filter @keel/core --filter reference-service-nest run test
      - name: Build the service
        run: pnpm --filter reference-service-nest run build
