name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The repo default branch is `dev` (for day-to-day PRs). Releases are cut
          # from `main`, so pin the target explicitly; otherwise the action opens its
          # release PR against the default branch (`dev`). See ADR-0015.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish + sign the image when release-please just cut a release. This runs
  # inside the same workflow the merge push triggered, so it is NOT suppressed
  # the way an `on: release` / `on: push: tags` event from GITHUB_TOKEN would be.
  publish-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
