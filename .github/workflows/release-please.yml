name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The repo default branch is `dev` (for day-to-day PRs). Releases are cut
          # from `main`, so pin the target explicitly; otherwise the action opens its
          # release PR against the default branch (`dev`). See ADR-0015.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
