# Reusable CI for a generated keel Python service (ADR-0009 Tier 3, ADR-0021). An extracted
# service repo references this by tag:
#
#   jobs:
#     ci:
#       uses: jeetparekh3005/keel/.github/workflows/service-python.yml@v1
#
# so a fix to the lane reaches every service by a version bump, not a copied-and-rotted YAML.
# In-tree the vertical is covered by python.yml; this lane is for the polyrepo future (ADR-0011).
name: keel Python service CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Service directory to gate."
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint + format
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: Dependency CVEs (pip-audit, blocking)
        # Mirrors the in-tree security.yml gate: audit the resolved dependencies for advisories.
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev -o requirements.txt
          uvx pip-audit==2.9.0 --requirement requirements.txt
