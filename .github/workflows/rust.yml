name: Rust

# Format, lint, and test the Rust vertical. The dev environment has no local Rust
# toolchain (ADR-0017), so this lane is the verification signal for Rust slices.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Postgres for the reference-service CRUD integration test (gated on the URL below).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain declared in rust-toolchain.toml (stable + rustfmt/clippy).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Start Keycloak (import realm)
        # Keycloak imports the shared realm on boot, so it can't run as a service
        # container (those can't pass `--import-realm`); run it as a step like python.yml.
        # The imported realm has the service-account client keel-api / secret test-secret.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:25.0 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Test
        # --include-ignored runs the #[ignore]'d integration tests too: the Postgres CRUD
        # round-trip (Postgres service above + KEEL_TEST_DATABASE_URL) and the live
        # Keycloak JWKS verification (the container above + KEEL_KEYCLOAK_* below). Both
        # fail loudly, not silently, if their backing service is missing.
        env:
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
        run: cargo test --all --locked -- --include-ignored
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - name: Audit dependencies for RUSTSEC advisories (blocking)
        # Source-level CVE gate against Cargo.lock: the distroless release binary hides
        # crate metadata from Trivy's image scan, so this is where Rust advisories are
        # caught. Fails the build on any known-vulnerable dependency.
        run: cargo audit
