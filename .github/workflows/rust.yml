name: Rust

# Format, lint, and test the Rust vertical. The dev environment has no local Rust
# toolchain (ADR-0017), so this lane is the verification signal for Rust slices.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  # Nightly full coverage sweep. The 85% llvm-cov floor is OFF the per-PR critical path
  # (pull_request runs only fmt+clippy+test, see the conditional steps below); it runs on
  # every push to dev/main and here nightly so a coverage regression is caught within a day
  # even on a branch that never pushes to dev. Schedule ignores the paths filter by design.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # A cold compile of the full feature set (nats+grpc+vault+aws) under cargo-llvm-cov
    # legitimately runs ~45-60 min; this bound exists to kill a genuine HANG (e.g. an
    # unbounded network/credential call in a test) with a clear signal instead of letting
    # it run to the 6-hour default. Raise it if a legitimate cold build ever approaches it.
    timeout-minutes: 80
    # Postgres for the reference-service CRUD integration test (gated on the URL below).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
      # Backs the OpenBaoSecretProvider KV v2 round-trip integration test (ADR-0023), gated
      # on KEEL_VAULT_ADDR below against the dev OpenBao server started as a step.
      KEEL_VAULT_ADDR: http://localhost:8200
      KEEL_VAULT_TOKEN: root
      KEEL_VAULT_MOUNT: secret
      KEEL_VAULT_PATH: keel-test
      # Backs the AwsSecretsManagerSecretProvider round-trip integration test (ADR-0024), gated on
      # KEEL_AWS_SECRET_ID below against the LocalStack Secrets Manager container started as a step.
      # The SDK honors AWS_ENDPOINT_URL_SECRETS_MANAGER to target LocalStack and resolves the static
      # test credentials from the default chain; nothing here is a real AWS account.
      AWS_ENDPOINT_URL_SECRETS_MANAGER: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KEEL_AWS_SECRET_ID: keel-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain declared in rust-toolchain.toml (stable + rustfmt/clippy).
      # llvm-tools-preview ships llvm-cov/llvm-profdata, which cargo-llvm-cov drives to
      # instrument the build and render the coverage report for the floor below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cargo-llvm-cov instruments into a SEPARATE target dir (different RUSTFLAGS), which
          # the default cache does not cover - so the coverage build recompiled the whole tree
          # every run. Cache it too so repeat runs (unchanged Cargo.lock) are fast; a new-SDK PR
          # that changes Cargo.lock still pays one cold build.
          cache-directories: target/llvm-cov-target
      - name: Install cargo-llvm-cov
        # Only the coverage floor needs llvm-cov, and that runs on push/schedule, not on PRs
        # (see the two conditional test steps below). Skipping the install on PRs keeps the
        # fast PR gate lean.
        if: github.event_name != 'pull_request'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step (like python.yml).
        # Backs the NatsMessageBus round-trip integration test gated on KEEL_NATS_URL below.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start RabbitMQ
        # Backs the RabbitMqMessageBus round-trip integration test (ADR-0025) gated on
        # KEEL_RABBITMQ_URL below. rabbitmq:4 is the current stable major, pinned to the major so a
        # patch refresh is automatic but a major bump is deliberate.
        #
        # The Rust job starts the most containers of any lane (postgres service + nats + keycloak +
        # openbao + localstack + rabbitmq) alongside a heavy cargo build, so RabbitMQ is the most
        # memory- and CPU-contended broker here. Two hardening measures:
        #  - A 1g container memory cap so the broker is bounded under contention. RabbitMQ 4 is
        #    cgroup-aware and derives its vm_memory_high_watermark from the container limit, so it
        #    self-throttles publishers well below the cap instead of being OOM-killed (an OOM-killed
        #    broker is exactly what produced the downstream "connection refused" the test saw). The
        #    legacy RABBITMQ_VM_MEMORY_HIGH_WATERMARK env var is NOT used: it is deprecated and the
        #    rabbitmq:4 image's entrypoint hard-exits on it, which would itself prevent startup.
        #  - Readiness polls check_port_connectivity, which verifies the AMQP listener on 5672 is
        #    actually accepting -- `ping` only proves the Erlang node is up, not that the socket
        #    binds, so it can pass while connect still refuses. The loop then ASSERTS readiness and
        #    fails loud (dumping `docker logs` + `docker ps -a`) if the broker never comes up, so a
        #    future failure shows the real cause here instead of a misleading connection-refused in
        #    the test step.
        run: |
          docker run -d --name rabbitmq -p 5672:5672 --memory 1g rabbitmq:4
          ready=""
          for _ in $(seq 1 60); do
            if docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::RabbitMQ did not become ready (AMQP listener on 5672 never accepted)"
            docker logs rabbitmq || true
            docker ps -a || true
            exit 1
          fi
          echo "RabbitMQ AMQP listener is ready."
      - name: Start Keycloak (import realm)
        # Keycloak imports the shared realm on boot, so it can't run as a service
        # container (those can't pass `--import-realm`); run it as a step like python.yml.
        # The imported realm has the service-account client keel-api / secret test-secret.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Start OpenBao (dev)
        # A dev-mode server can't run as a service container (it needs the `server -dev`
        # args and IPC_LOCK), so run it as a step like NATS/Keycloak. Backs the
        # OpenBaoSecretProvider KV v2 round-trip integration test gated on KEEL_VAULT_ADDR.
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Start LocalStack (Secrets Manager)
        # Backs the AwsSecretsManagerSecretProvider GetSecretValue round-trip integration test
        # (ADR-0024) gated on KEEL_AWS_SECRET_ID. Run as a step (like OpenBao/NATS/Keycloak) so the
        # Secrets Manager emulator is reachable at localhost:4566 before the test runs.
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=secretsmanager localstack/localstack:4.9.1
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health >/dev/null && break; sleep 1; done
      - name: Test (PRs fast; push/nightly enforces the coverage floor)
        # Split to keep the per-PR critical path short. On a pull_request this runs the full
        # suite under a plain `cargo test` (non-instrumented, cached) so PRs - including the
        # dep-bump PRs that change Cargo.lock - get fmt+clippy+unit+integration signal in minutes
        # instead of waiting on the ~45-60 min instrumented coverage build. On push to dev/main
        # and on the nightly schedule it runs the same suite under cargo-llvm-cov and fails if
        # line coverage drops below 85%, matching the Python vertical's `fail_under = 85` gate so
        # the Rust vertical cannot silently regress below parity (epic #419, v0.6). The floor is
        # therefore still enforced on every merge to dev and every night - just off the PR wait.
        #
        # --include-ignored runs the #[ignore]'d integration tests too: the Postgres CRUD
        # round-trip (Postgres service above + KEEL_TEST_DATABASE_URL), the live Keycloak
        # JWKS verification (the container above + KEEL_KEYCLOAK_* below), the NATS
        # JetStream publish->subscribe round-trip (the NATS container above + KEEL_NATS_URL),
        # the RabbitMQ publish->subscribe round-trip (the RabbitMQ container above + KEEL_RABBITMQ_URL),
        # the OpenBao KV v2 write/read round-trip (the OpenBao container above + KEEL_VAULT_* at
        # job level), and the AWS Secrets Manager GetSecretValue round-trip (the LocalStack
        # container above + AWS_*/KEEL_AWS_SECRET_ID at job level). The NATS/AWS/secret round-trips
        # fail loudly if their backing service is missing; the RabbitMQ test self-skips when
        # KEEL_RABBITMQ_URL is unset (so it is a no-op locally) but runs for real here where the
        # container and URL are present. They are the paths that carry the service's
        # composition/http/repository, each broker adapter's connect/publish/subscribe/dispatch, and
        # the secret adapters' authenticate/load lines over the floor, so the coverage number is
        # only honest with them in. --features nats,grpc,vault,aws,gcp,rabbitmq builds the opt-in
        # NatsMessageBus and RabbitMqMessageBus adapters (and their integration tests), the opt-in
        # gRPC server factory/mTLS module (keel_core::grpc, ADR-0022), the opt-in OpenBaoSecretProvider
        # (keel_core::vault, ADR-0023), and the opt-in AwsSecretsManagerSecretProvider and
        # GcpSecretManagerSecretProvider over the shared caching core (keel_core::aws + keel_core::gcp
        # + keel_core::secret, ADR-0024) so all are exercised and counted here -- without them in the
        # feature set the new code is not compiled under test/coverage and the floor could not see it.
        # rabbitmq is new in this split (ADR-0025): the RabbitMqMessageBus adapter over lapin.
        env:
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
          KEEL_NATS_URL: nats://localhost:4222
          # lapin parses the AMQP URI strictly per spec: a bare trailing slash (`.../`) names the
          # EMPTY vhost, not the default `/`, so `%2f` is the explicit, canonical way to select the
          # default vhost. Other verticals' clients default an empty path to `/`; the Rust client
          # does not, so this URL is re-derived per-runtime rather than copied from a sibling lane.
          # Backs the RabbitMqMessageBus round-trip integration test gated on this var.
          KEEL_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2f
          # AWS belt-and-suspenders for the whole Rust test step (the AWS unit tests are already
          # hermetic via config, but the gated LocalStack integration test and any AWS SDK code
          # path run here too). Static creds + an explicit region keep the default credential chain
          # off the network; disabling IMDS and the account-id endpoint mode stops the SDK from
          # probing 169.254.169.254 / resolving an account-id endpoint on the Azure-backed runner
          # (the account-id "preferred" resolution was the 50-minute hang). These are process-level
          # env, set before the test binary starts, so they never race the SDK's std::env reads.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCOUNT_ID_ENDPOINT_MODE: disabled
        # --ignore-filename-regex genproto drops the committed buf stubs (prost/tonic
        # generated code under src/genproto) from the denominator: they are not held to the
        # crate's lint/style/coverage bar (see genproto.rs and the Python genproto excludes),
        # so only the hand-written server factory/mTLS in keel_core::grpc is measured.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fast PR gate: full suite, non-instrumented, cached. No coverage measurement here.
            cargo test --all --locked --features nats,grpc,vault,aws,gcp,rabbitmq -- --include-ignored
          else
            # Merge/nightly: same suite under instrumentation, 85% line floor enforced.
            cargo llvm-cov --all --locked --features nats,grpc,vault,aws,gcp,rabbitmq --ignore-filename-regex genproto --fail-under-lines 85 -- --include-ignored
          fi
      - name: Install cargo-audit
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit
      - name: Audit dependencies for RUSTSEC advisories (blocking)
        # Source-level CVE gate against Cargo.lock: the distroless release binary hides
        # crate metadata from Trivy's image scan, so this is where Rust advisories are
        # caught. Fails the build on any known-vulnerable dependency.
        run: cargo audit
