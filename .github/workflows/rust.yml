name: Rust

# Format, lint, and test the Rust vertical. The dev environment has no local Rust
# toolchain (ADR-0017), so this lane is the verification signal for Rust slices.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-rust/**"
      - "services/reference-service-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Postgres for the reference-service CRUD integration test (gated on the URL below).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
      # Backs the OpenBaoSecretProvider KV v2 round-trip integration test (ADR-0023), gated
      # on KEEL_VAULT_ADDR below against the dev OpenBao server started as a step.
      KEEL_VAULT_ADDR: http://localhost:8200
      KEEL_VAULT_TOKEN: root
      KEEL_VAULT_MOUNT: secret
      KEEL_VAULT_PATH: keel-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain declared in rust-toolchain.toml (stable + rustfmt/clippy).
      # llvm-tools-preview ships llvm-cov/llvm-profdata, which cargo-llvm-cov drives to
      # instrument the build and render the coverage report for the floor below.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step (like python.yml).
        # Backs the NatsMessageBus round-trip integration test gated on KEEL_NATS_URL below.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start Keycloak (import realm)
        # Keycloak imports the shared realm on boot, so it can't run as a service
        # container (those can't pass `--import-realm`); run it as a step like python.yml.
        # The imported realm has the service-account client keel-api / secret test-secret.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Start OpenBao (dev)
        # A dev-mode server can't run as a service container (it needs the `server -dev`
        # args and IPC_LOCK), so run it as a step like NATS/Keycloak. Backs the
        # OpenBaoSecretProvider KV v2 round-trip integration test gated on KEEL_VAULT_ADDR.
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Test with coverage floor (85% lines)
        # Runs the full suite under cargo-llvm-cov and fails the job if line coverage
        # drops below 85%, matching the Python vertical's `fail_under = 85` gate so the
        # Rust vertical cannot silently regress below parity (epic #419, v0.6).
        #
        # --include-ignored runs the #[ignore]'d integration tests too: the Postgres CRUD
        # round-trip (Postgres service above + KEEL_TEST_DATABASE_URL), the live Keycloak
        # JWKS verification (the container above + KEEL_KEYCLOAK_* below), the NATS
        # JetStream publish->subscribe round-trip (the NATS container above + KEEL_NATS_URL),
        # and the OpenBao KV v2 write/read round-trip (the OpenBao container above +
        # KEEL_VAULT_* at job level). Each fails loudly, not silently, if its backing service
        # is missing -- and they are the paths that carry the service's composition/http/
        # repository, the broker adapter's connect/publish/subscribe/dispatch, and the vault
        # adapter's authenticate/load lines over the floor, so the coverage number is only
        # honest with them in. --features nats,grpc,vault builds the opt-in NatsMessageBus
        # adapter (and its integration test), the opt-in gRPC server factory/mTLS module
        # (keel_core::grpc, ADR-0022), and the opt-in OpenBaoSecretProvider (keel_core::vault,
        # ADR-0023) so all three are exercised and counted here -- without them in the feature
        # set the new code is not compiled under coverage and the floor could not see it.
        env:
          KEEL_KEYCLOAK_URL: http://localhost:8080
          KEEL_KEYCLOAK_REALM: keel
          KEEL_KEYCLOAK_CLIENT_ID: keel-api
          KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
          KEEL_OIDC_AUDIENCE: keel-api
          KEEL_NATS_URL: nats://localhost:4222
        # --ignore-filename-regex genproto drops the committed buf stubs (prost/tonic
        # generated code under src/genproto) from the denominator: they are not held to the
        # crate's lint/style/coverage bar (see genproto.rs and the Python genproto excludes),
        # so only the hand-written server factory/mTLS in keel_core::grpc is measured.
        run: cargo llvm-cov --all --locked --features nats,grpc,vault --ignore-filename-regex genproto --fail-under-lines 85 -- --include-ignored
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - name: Audit dependencies for RUSTSEC advisories (blocking)
        # Source-level CVE gate against Cargo.lock: the distroless release binary hides
        # crate metadata from Trivy's image scan, so this is where Rust advisories are
        # caught. Fails the build on any known-vulnerable dependency.
        run: cargo audit
