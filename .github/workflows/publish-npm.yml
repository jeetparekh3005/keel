name: publish-npm

# Publishes @keel/core to npm at its own independent version (ADR-0028, #422). Needs an npm
# automation token (NPM_TOKEN) for the @keel org. Called from release-please.yml at release;
# skips cleanly if the token is absent, and is idempotent (a version already on npm is skipped).

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @keel/core build
      - name: Publish @keel/core to npm
        working-directory: packages/keel-core-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set; skipping npm publish."
            exit 0
          fi
          ver="$(node -p "require('./package.json').version")"
          if npm view "@keel/core@${ver}" version >/dev/null 2>&1; then
            echo "@keel/core@${ver} already published; skipping (idempotent)."
            exit 0
          fi
          npm publish --access public
          echo "published @keel/core@${ver} to npm"
