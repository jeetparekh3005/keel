name: Helm

# Lint the chart and schema-validate its rendered manifests on any chart change.

on:
  # No path filter: this is a required status check, so it must report on every PR
  # (a path-filtered required check hangs as "Expected" on unrelated PRs). Same
  # rationale as python.yml.
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  validate:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz kubeconform
      - name: Lint, validate, and policy-check every chart
        # ci/test-values supplies the now-required OIDC config so rendering succeeds.
        # kubeconform checks schema shape only; policy_check fails the build if a
        # rendered Deployment loses runAsNonRoot / readOnlyRootFilesystem / dropped
        # caps / seccomp / resource limits, so the security posture cannot regress.
        run: |
          python3 -m pip install --quiet pyyaml
          for chart in deploy/charts/*/; do
            echo "=== $chart ==="
            helm lint "$chart" -f "$chart/ci/test-values.yaml"
            helm template rs "$chart" -f "$chart/ci/test-values.yaml" \
              | ./kubeconform -strict -summary -schema-location default
            helm template rs "$chart" -f "$chart/ci/test-values.yaml" \
              | python3 "$chart/ci/policy_check.py"
          done
