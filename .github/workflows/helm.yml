name: Helm

# Lint the chart and schema-validate its rendered manifests on any chart change.

on:
  # No path filter: this is a required status check, so it must report on every PR
  # (a path-filtered required check hangs as "Expected" on unrelated PRs). Same
  # rationale as python.yml.
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART: deploy/charts/reference-service
  KUBECONFORM_VERSION: v0.8.0

jobs:
  validate:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: helm lint
        # ci/test-values supplies the now-required OIDC config so rendering succeeds.
        run: helm lint "${CHART}" -f "${CHART}/ci/test-values.yaml"
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz kubeconform
      - name: Validate rendered manifests
        run: |
          helm template rs "${CHART}" -f "${CHART}/ci/test-values.yaml" \
            | ./kubeconform -strict -summary -schema-location default
      - name: Enforce Pod Security Standards posture
        # kubeconform checks schema shape only; this fails the build if the
        # rendered Deployment loses runAsNonRoot / readOnlyRootFilesystem / dropped
        # caps / seccomp / resource limits, so the security posture cannot regress.
        run: |
          python3 -m pip install --quiet pyyaml
          helm template rs "${CHART}" -f "${CHART}/ci/test-values.yaml" \
            | python3 "${CHART}/ci/policy_check.py"
