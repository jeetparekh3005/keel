name: Image

# PR: build + CVE-scan each service image. Release: publish + sign each. The publish
# job runs via workflow_call (from release-please, inside a run the human merge
# triggered - NOT a GITHUB_TOKEN event, which would be suppressed) or via
# workflow_dispatch for a manual backfill. See ADR-0008.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "services/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "go.work"
      - "go.work.sum"
      - "Cargo.lock"
      - "**/Dockerfile"
      - ".github/workflows/image.yml"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.4)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.3)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  # Cancel superseded PR builds, but NEVER cancel a publish run: cancelling between
  # docker push and cosign sign/attest would leave a pushed-but-unsigned image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-scan:
    name: Image build + scan (Trivy)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reference-service
            dockerfile: services/reference-service/Dockerfile
          - name: reference-service-rust
            dockerfile: services/reference-service-rust/Dockerfile
          - name: reference-service-go
            dockerfile: services/reference-service-go/Dockerfile
          - name: reference-service-nest
            dockerfile: services/reference-service-nest/Dockerfile
          - name: reference-service-java
            dockerfile: services/reference-service-java/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (load locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: keel-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Fallback DB registries: the default mirror.gcr.io once 404'd mid-release on the Java DB
          # (needed only to scan the Spring Boot fat jar). Trivy tries these in order, so a mirror
          # hiccup falls back to the canonical GHCR source instead of failing the scan.
          TRIVY_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db"
          TRIVY_JAVA_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db"
        with:
          image-ref: keel-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  publish:
    name: Image publish + sign
    # Runs on workflow_call (from release-please) and workflow_dispatch (manual
    # backfill). A reusable workflow inherits the caller's event_name (e.g.
    # `push`), so gate on "not a PR" rather than on `workflow_call`.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign / attestations (OIDC)
      attestations: write # provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reference-service
            dockerfile: services/reference-service/Dockerfile
          - name: reference-service-rust
            dockerfile: services/reference-service-rust/Dockerfile
          - name: reference-service-go
            dockerfile: services/reference-service-go/Dockerfile
          - name: reference-service-nest
            dockerfile: services/reference-service-nest/Dockerfile
          - name: reference-service-java
            dockerfile: services/reference-service-java/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Push BY DIGEST only (no human tag yet). The release tag is applied after the
          # Trivy gate passes, so a failed scan never leaves a vulnerable image reachable
          # at the release tag (only an unreferenced, GC-able digest).
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from here: the GHA cache is writable from pull_request runs, so
          # reading it on the signed-release build would let a PR poison layers that
          # end up cosign-signed + SLSA-attested. A release builds clean.
      - name: Trivy scan the pushed digest before tagging/signing (gate HIGH/CRITICAL)
        # Gate BEFORE the release tag exists: a failed scan blocks tagging, signing, and
        # attestation, so nothing vulnerable is ever published at the release tag. Does
        # NOT ignore-unfixed (the compensating control for the rolling base, ADR-0008).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Fallback DB registries so a mirror.gcr.io hiccup on the Java DB cannot fail a release
          # publish (it did once at v0.4.0); Trivy tries these in order.
          TRIVY_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db"
          TRIVY_JAVA_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db"
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          vuln-type: os,library
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
      - name: Attest the SBOM (keyless)
        run: cosign attest --yes --predicate image.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Apply the release tags now that the image is scanned, signed, and attested
        # LAST step: the digest is Trivy-vetted, cosign-signed, and SLSA/SBOM-attested
        # before any human tag points at it, so there is never a window where the release
        # tag resolves to an unsigned or unscanned image.
        run: |
          flags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && flags="$flags -t $tag"
          done <<< "${TAGS}"
          docker buildx imagetools create $flags "${IMAGE}@${DIGEST}"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
