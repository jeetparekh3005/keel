name: Image

# PR: build + CVE-scan the reference-service image. Release: publish + sign.
# The publish job runs via workflow_call (from release-please, inside a run the
# human merge triggered - NOT a GITHUB_TOKEN event, which would be suppressed)
# or via workflow_dispatch for a manual backfill. See ADR-0008.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "services/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "**/Dockerfile"
      - ".github/workflows/image.yml"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.4)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.3)."
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/reference-service
  DOCKERFILE: services/reference-service/Dockerfile

concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-scan:
    name: Image build + scan (Trivy)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (load locally, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: keel-reference-service:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: keel-reference-service:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  publish:
    name: Image publish + sign
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign / attestations (OIDC)
      attestations: write # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
      - name: Attest the SBOM (keyless)
        run: cosign attest --yes --predicate image.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
