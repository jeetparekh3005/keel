name: Go

# Format, vet, lint, test, and vuln-scan the Go vertical. govulncheck is the
# dependency-CVE gate (the Go-native equivalent of pip-audit / cargo-audit).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/keel-core-go/**"
      - "services/reference-service-go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/go.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/keel-core-go/**"
      - "services/reference-service-go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt, vet, staticcheck, test, vuln)
    runs-on: ubuntu-latest
    # Postgres for the persistence/reference integration tests (gated on the URL below).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@localhost:5432/reference
      KEEL_NATS_URL: nats://localhost:4222
      KEEL_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      KEEL_KAFKA_BROKERS: localhost:9092
      KEEL_KEYCLOAK_URL: http://localhost:8080
      KEEL_KEYCLOAK_REALM: keel
      KEEL_KEYCLOAK_CLIENT_ID: keel-api
      KEEL_KEYCLOAK_CLIENT_SECRET: test-secret
      KEEL_OIDC_AUDIENCE: keel-api
      KEEL_VAULT_ADDR: http://localhost:8200
      KEEL_VAULT_TOKEN: root
      KEEL_VAULT_MOUNT: secret
      KEEL_VAULT_PATH: keel-test
      # AWS Secrets Manager adapter integration test (ADR-0024). The SDK honors
      # AWS_ENDPOINT_URL_SECRETS_MANAGER, pointing it at the LocalStack step below; the dummy
      # credentials are what LocalStack expects. KEEL_AWS_SECRET_ID gates the test.
      AWS_ENDPOINT_URL_SECRETS_MANAGER: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KEEL_AWS_SECRET_ID: keel-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Start NATS (JetStream)
        # A service container can't pass the `-js` arg, so run it as a step. The messaging package
        # integration test publishes and subscribes against this instance, asserting payload
        # delivery and trace-context propagation; it skips when KEEL_NATS_URL is unset.
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15 -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start RabbitMQ
        # The messaging package integration test publishes and subscribes against this instance,
        # asserting payload/header delivery and trace-context propagation; it skips when
        # KEEL_RABBITMQ_URL is unset. Pinned to the latest-stable 4.x line (ADR-0025).
        run: |
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:4
          for _ in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Start Kafka (KRaft)
        # The messaging package integration test publishes and subscribes against this instance,
        # asserting payload/header delivery, trace-context propagation, and the poison-record
        # dead-letter round-trip; it skips when KEEL_KAFKA_BROKERS is unset. Pinned to the
        # latest-stable 4.x line (ADR-0025). This is the reference broker config for the Kafka
        # sub-wave; the other four verticals copy the env below verbatim.
        #
        # Single-node KRaft (no ZooKeeper): the broker is also the sole controller. The one setting
        # that must be exact is KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 - the broker
        # hands this address back to a client after the bootstrap connect, so a client on the runner
        # host (reaching the broker through the -p 9092:9092 mapping) must be told to reconnect to
        # localhost:9092, not the container's internal hostname. Get this wrong and the bootstrap
        # succeeds but every produce/fetch then dials an unresolvable broker and hangs. The CONTROLLER
        # listener stays on 9093 (internal only, not mapped). Replication/ISR factors are forced to 1
        # because there is a single broker, and auto-create is left on so publish and the adapter's
        # <topic>.retry / <topic>.dlq produce create their topics on first use.
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            apache/kafka:4.4.0
          # Readiness must gate on the broker actually serving a client API request, not just the TCP
          # port being open (a KRaft broker accepts connections before it finishes forming the quorum
          # and can serve metadata). kafka-topics --list drives a real client round-trip, so the step
          # proceeds only once produce/consume will succeed.
          echo "waiting for Kafka to accept client connections..."
          for _ in $(seq 1 60); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      - name: Start Keycloak (import realm)
        # A service container can't mount the realm file or pass --import-realm, so run it as a
        # step. The OIDC integration test (auth package) mints a client_credentials token and
        # verifies it against this instance's live JWKS; it skips when KEEL_KEYCLOAK_URL is unset.
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v "$PWD/deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          echo "waiting for the keel realm to be ready..."
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/keel/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 3
          done
      - name: Start OpenBao (dev)
        # A dev-mode server auto-unseals and enables a KV v2 mount at `secret`, so run it as a
        # step with a known root token. The adapters package integration test writes a KV v2
        # secret and reads it back through the OpenBao SecretProvider; it skips when
        # KEEL_VAULT_ADDR is unset.
        run: |
          docker run -d --name openbao -p 8200:8200 --cap-add IPC_LOCK -e BAO_DEV_ROOT_TOKEN_ID=root openbao/openbao:2.7.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
      - name: Start LocalStack (Secrets Manager)
        # The AWS Secrets Manager SecretProvider integration test (adapters package) creates a
        # JSON secret and reads it back through the adapter; it skips when KEEL_AWS_SECRET_ID is
        # unset. The SDK reaches this container via AWS_ENDPOINT_URL_SECRETS_MANAGER (job env).
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=secretsmanager localstack/localstack:4.9.1
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health >/dev/null && break; sleep 1; done
      - name: Format check
        run: |
          # templates/ holds Copier templates (<< >> placeholders), not valid Go, so exclude them
          # (the generator lane dogfoods a rendered service instead).
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^templates/'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet, lint, test (with coverage), and vuln-scan each module
        # The repo is a go.work with nested modules, so run the per-module gate inside
        # each module directory. govulncheck is blocking: it fails the build on any known
        # vulnerability the code actually reaches. Each module emits a coverage profile that
        # the next step merges into one vertical-wide total and enforces against a floor
        # (the Go analog of Python's pytest --cov ... fail_under=85). Postgres and Keycloak
        # above make the integration tests run, so the measured total is the real one, not a
        # local lower bound where those paths skip.
        run: |
          set -e
          : > "$RUNNER_TEMP/go-coverage-merged.out"
          first=1
          for mod in $(find packages services -name go.mod 2>/dev/null | xargs -n1 dirname | sort -u); do
            echo "::group::$mod"
            ( cd "$mod"
              go vet ./...
              go run honnef.co/go/tools/cmd/staticcheck@latest ./...
              # Exclude the committed buf stubs (genproto, ADR-0022) from the coverage set: they
              # are generated code with no tests and would otherwise dilute the hand-written
              # coverage floor. staticcheck already skips them via the generated-code marker.
              go test -coverprofile=cover.out -covermode=atomic $(go list ./... | grep -v '/genproto')
              go run golang.org/x/vuln/cmd/govulncheck@latest ./...
            )
            # Merge this module's profile into the vertical-wide one, keeping a single
            # "mode:" header (the first module's) and appending every later module's body.
            if [ "$first" = 1 ]; then
              cat "$mod/cover.out" >> "$RUNNER_TEMP/go-coverage-merged.out"
              first=0
            else
              tail -n +2 "$mod/cover.out" >> "$RUNNER_TEMP/go-coverage-merged.out"
            fi
            echo "::endgroup::"
          done
      - name: Coverage floor
        # Enforce a hard, vertical-wide statement-coverage floor across both Go modules
        # (keel-core-go + reference-service-go), mirroring Python's 85% fail_under. The service
        # module now boots end-to-end in a test (cmd/reference-service run() is driven against the
        # Postgres above, then cancelled to assert graceful shutdown) and its handlers, repository,
        # and config are covered, so the merged total clears the 85% parity bar. Raise FLOOR only
        # to the measured total; never above it.
        run: |
          set -e
          FLOOR=85
          total=$(go tool cover -func="$RUNNER_TEMP/go-coverage-merged.out" | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Go vertical statement coverage: ${total}% (floor ${FLOOR}%)"
          awk -v t="$total" -v f="$FLOOR" 'BEGIN { exit !(t + 0 >= f + 0) }' || {
            echo "::error::Go coverage ${total}% is below the ${FLOOR}% floor"
            exit 1
          }
