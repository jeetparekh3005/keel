version: 2
updates:
  # Keep GitHub Actions pinned and patched. Language ecosystems are added
  # per vertical (pip/uv, npm, cargo, gomod, gradle) as they land.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:ci"

  # Python dependencies (uv workspace). Security CVEs are also gated by pip-audit in CI.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:python"

  # Frontend dependencies (pnpm workspace). Security CVEs are also gated by pnpm audit in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:ts"
