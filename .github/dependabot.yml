version: 2
updates:
  # Keep GitHub Actions pinned and patched. Language ecosystems are added
  # per vertical (pip/uv, npm, cargo, gomod, gradle) as they land.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:ci"

  # Python dependencies (uv workspace). Security CVEs are also gated by pip-audit in CI.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:python"

  # Frontend dependencies (pnpm workspace). Security CVEs are also gated by pnpm audit in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:ts"

  # Rust dependencies (Cargo workspace). Security advisories are also gated by cargo-audit in CI.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:rust"

  # Container images pinned by digest in the service Dockerfiles (e.g. the uv build tool),
  # so the digest pins are kept current instead of silently going stale.
  - package-ecosystem: docker
    directories:
      - /services/reference-service
      - /services/reference-service-rust
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:ci"
