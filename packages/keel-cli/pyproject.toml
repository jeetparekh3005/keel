[project]
name = "keel-cli"
version = "0.1.0"
description = "keel CLI: scaffold and maintain keel services (thin Copier wrapper + platform.yaml conformance check)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "copier>=9.4",
    "pyyaml>=6.0",
]

[project.scripts]
keel = "keel_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_cli"]
