[project]
name = "keel-core"
version = "0.1.0"
description = "keel platform core: ports, cross-cutting adapters, and test kit"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",  # pulls pydantic; declare pydantic directly when a module imports it
    "structlog>=24.4",
    "fastapi>=0.162.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "pyjwt[crypto]>=2.15.1",
    "starlette>=0.37",            # ASGI middleware types/utilities (fastapi pins a compatible version)
    "opentelemetry-sdk>=1.27",    # OTLP exporter added at deployment time
    "opentelemetry-instrumentation-fastapi>=0.48b0",  # route-templated http.server.* spans + metrics
]

[project.optional-dependencies]
# gRPC is opt-in: REST-only services should not pull the grpcio C-extension.
grpc = [
    "grpcio>=1.60",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]
# NATS JetStream is opt-in: REST-only services should not pull the client.
nats = [
    "nats-py>=2.6",
]
# RabbitMQ is opt-in (ADR-0025): REST-only services should not pull the client.
# aio-pika is the async client (over aiormq); it carries its own type hints.
rabbitmq = [
    "aio-pika>=9.5",
]
# AWS Secrets Manager backend (ADR-0024) is opt-in: only services using it pull boto3.
# boto3 handles SigV4 signing and the default credential chain (env, IRSA, instance
# profile, SSO); the standard AWS_ENDPOINT_URL_SECRETS_MANAGER env var points it at
# LocalStack in tests, so no custom endpoint config is carried here.
aws = [
    "boto3>=1.42",
    # botocore is imported directly for botocore.config.Config (bounded client timeouts/retries).
    # It ships with boto3, but declare it since we import it (deptry DEP003).
    "botocore>=1.42",
]
# GCP Secret Manager backend (ADR-0024) is opt-in: only services using it pull the SDK.
# google-cloud-secret-manager handles the OAuth2 exchange and Application Default
# Credentials (env, Workload Identity, metadata server). google-api-core is imported
# directly for NotFound and the bounded Retry, so declare it (deptry DEP003) even though
# it ships transitively with the client.
gcp = [
    "google-cloud-secret-manager>=2.20",
    "google-api-core>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_core"]

[tool.deptry]
# genproto/ is the committed buf output for the keel.reference.v1 contract (ADR-0022). Its
# imports (google.protobuf, the on-path `keel` package) are an artifact of codegen, not real
# project dependencies; the regeneration dogfood (proto.yml) is its gate, not deptry.
extend_exclude = ["src/keel_core/genproto"]

[tool.deptry.per_rule_ignores]
# `keel` is not a distribution: it is the vendored keel.reference.v1 stub tree reached via the
# genproto sys.path shim (ADR-0022), imported by the ItemService adapter. Not a missing dep.
# `mypy_boto3_secretsmanager` is a type-only stub (boto3-stubs) imported under TYPE_CHECKING in
# the AWS adapter (ADR-0024); it is a dev/type dependency, never imported at runtime.
DEP001 = ["keel", "mypy_boto3_secretsmanager"]
