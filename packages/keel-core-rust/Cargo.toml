[package]
name = "keel-core-rust"
description = "keel shared platform library for the Rust vertical (ADR-0009, ADR-0017)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "keel_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "set-header", "request-id"] }
http-body-util = "0.1"
jsonwebtoken = "9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# rt + time: background JWKS refresh task (tokio::spawn + interval).
tokio = { version = "1", features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
] }
# Optional NATS JetStream MessageBus adapter (the `nats` feature). Mirrors the Python
# `keel-core[nats]` extra: the broker client is pulled in only when the feature is
# enabled, so the default core build needs no broker and no NATS crates.
async-nats = { version = "0.52", optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# Opt-in gRPC stubs (the `grpc` feature). prost backs the generated messages and
# tonic the generated client/server; off by default so `cargo build` stays
# gRPC-free, mirroring the Python `keel-core[grpc]` extra.
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }

[features]
# Opt-in NATS JetStream adapter. Off by default so `cargo build` stays broker-free,
# the same way `pip install keel-core` omits nats-py until you ask for the `nats` extra.
# `opentelemetry_sdk/trace` makes `propagation::TraceContextPropagator` available for the
# W3C trace-context inject/extract over message headers.
nats = [
    "dep:async-nats",
    "dep:futures",
    "dep:async-trait",
    "dep:bytes",
    "opentelemetry_sdk/trace",
]
# Opt-in gRPC stubs for the keel.reference.v1 contract (ADR-0022). Off by default so
# the default `cargo build` pulls in neither prost nor tonic (parity with Python's
# `keel-core[grpc]` extra); the generated code lives in `keel_core::genproto` and the
# server factory/mTLS builders in `keel_core::grpc`. `tonic/tls-ring` turns on the
# ring-backed rustls path so the mTLS `ServerTlsConfig`/`ClientTlsConfig` builders
# compile (ring is already in the tree via reqwest's rustls-tls, so no aws-lc-rs).
grpc = [
    "dep:prost",
    "dep:tonic",
    "dep:tonic-prost",
    "tonic/tls-ring",
]

[dev-dependencies]
figment = { version = "0.10", features = ["env", "toml", "test"] }
# sync + time back the NATS integration test (mpsc handoff from the consumer task and a
# receive timeout so a missed delivery fails fast instead of hanging). rt-multi-thread +
# net back the in-process gRPC tests (a loopback server task plus a client channel over a
# real TCP connection, the only way to exercise the tonic transport + TLS handshake).
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# InMemoryMetricExporter (gated behind the `testing` feature) backs the HTTP metrics test.
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics", "testing"] }
# Ephemeral RSA keypairs for the OIDC tests; no key material is committed.
rsa = "0.10"
rand = "0.10"
# TcpListenerStream adapts a bound :0 listener into the incoming stream the gRPC tests
# serve, so the ephemeral port is known before the client connects (no bind race).
tokio-stream = { version = "0.1", features = ["net"] }
# Ephemeral CA + leaf certs for the mTLS handshake tests; ring-backed to match tls-ring,
# and (like the OIDC keys) generated in-test so no key material is committed.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
