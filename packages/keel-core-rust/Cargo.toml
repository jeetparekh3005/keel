[package]
name = "keel-core-rust"
description = "keel shared platform library for the Rust vertical (ADR-0009, ADR-0017)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "keel_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "set-header", "request-id"] }
http-body-util = "0.1"
jsonwebtoken = "9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# rt + time: background JWKS refresh task (tokio::spawn + interval).
tokio = { version = "1", features = ["rt", "time"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
] }

[dev-dependencies]
figment = { version = "0.10", features = ["env", "toml", "test"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# InMemoryMetricExporter (gated behind the `testing` feature) backs the HTTP metrics test.
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics", "testing"] }
# Ephemeral RSA keypairs for the OIDC tests; no key material is committed.
rsa = "0.10"
rand = "0.10"
